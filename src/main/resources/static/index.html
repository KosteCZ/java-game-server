<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplayer Game Server - STOMP Client (Secured)</title>
  <!-- STOMP.js UMD library via jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --cell-bg: #334155;
      --cell-hover: #475569;
      --cell-active: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-group h1 { font-size: 1.3rem; font-weight: 700; }
    .title-group p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
      transition: all 0.3s ease;
    }

    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .status-badge.connecting {
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
    .status-badge.connected .status-dot { box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.2); } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) auto;
      gap: 12px;
      align-items: flex-end;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.75rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); }

    input[type="text"], input[type="password"] {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      padding: 8px 12px;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus { border-color: var(--primary); }
    input:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .content-grid { grid-template-columns: 1fr; }
    }

    .board-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .board-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(3, 85px);
      grid-template-rows: repeat(3, 85px);
      gap: 8px;
    }

    .cell {
      background: var(--cell-bg);
      border: 2px solid transparent;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease-in-out;
    }

    .cell:hover:not(.disabled) { background: var(--cell-hover); border-color: var(--primary); }
    .cell.disabled { cursor: not-allowed; opacity: 0.5; }
    .cell.last-move { border-color: var(--success); box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }

    .log-card { display: flex; flex-direction: column; gap: 8px; height: 350px; }
    .log-header { display: flex; justify-content: space-between; align-items: center; }
    .log-header h2 { font-size: 0.95rem; font-weight: 700; }

    .btn-small {
      padding: 4px 8px;
      font-size: 0.75rem;
      background: var(--cell-bg);
      color: var(--text-muted);
      border-radius: 6px;
      border: 1px solid var(--card-border);
      cursor: pointer;
    }

    .btn-small:hover { color: var(--text-main); background: var(--cell-hover); }

    .log-container {
      flex: 1;
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-entry { line-height: 1.3; word-break: break-all; border-bottom: 1px solid #1e293b; padding-bottom: 3px; }
    .log-time { color: #64748b; margin-right: 4px; }
    .log-type-info { color: #38bdf8; }
    .log-type-success { color: #4ade80; }
    .log-type-warning { color: #facc15; }
    .log-type-error { color: #f87171; }
    .log-type-move { color: #c084fc; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <div class="title-group">
        <h1>Multiplayer Game Server (JWT Secured)</h1>
        <p>Spring Boot 3 + Supabase PostgreSQL + STOMP WebSocket Security</p>
      </div>
      <div id="connectionStatus" class="status-badge">
        <span class="status-dot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- Authentication Card -->
    <section class="card">
      <div class="controls-grid">
        <div class="form-group">
          <label for="usernameInput">Username</label>
          <input type="text" id="usernameInput" value="player1" placeholder="Username">
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" value="secret123" placeholder="Password">
        </div>
        <div style="display:flex; gap:8px;">
          <button id="authBtn" class="btn btn-primary" onclick="handleAuth('login')">Login</button>
          <button class="btn btn-small" onclick="handleAuth('register')">Register</button>
        </div>
      </div>
      <div id="authStatusText" style="font-size:0.8rem; color:var(--text-muted); margin-top:8px;">
        Not authenticated. Log in or register to obtain a JWT.
      </div>
    </section>

    <!-- Room / Connection Controls -->
    <section class="card">
      <div class="controls-grid">
        <div class="form-group">
          <label for="gameIdInput">Game Room ID</label>
          <input type="text" id="gameIdInput" value="room-101" placeholder="e.g. room-101">
        </div>
        <button id="joinBtn" class="btn btn-success" onclick="toggleConnection()" disabled>Join & Connect</button>
      </div>
    </section>

    <!-- Board & Activity Log -->
    <main class="content-grid">
      <section class="card board-card">
        <div class="board-header">
          <span id="roomLabel">Room: None</span>
          <span id="lastMoveLabel">Last Move: -</span>
        </div>

        <div class="game-board" id="gameBoard">
          <button class="cell disabled" data-index="0" data-row="0" data-col="0" onclick="onCellClick(0, 0, 0)">-</button>
          <button class="cell disabled" data-index="1" data-row="0" data-col="1" onclick="onCellClick(1, 0, 1)">-</button>
          <button class="cell disabled" data-index="2" data-row="0" data-col="2" onclick="onCellClick(2, 0, 2)">-</button>
          <button class="cell disabled" data-index="3" data-row="1" data-col="0" onclick="onCellClick(3, 1, 0)">-</button>
          <button class="cell disabled" data-index="4" data-row="1" data-col="1" onclick="onCellClick(4, 1, 1)">-</button>
          <button class="cell disabled" data-index="5" data-row="1" data-col="2" onclick="onCellClick(5, 1, 2)">-</button>
          <button class="cell disabled" data-index="6" data-row="2" data-col="0" onclick="onCellClick(6, 2, 0)">-</button>
          <button class="cell disabled" data-index="7" data-row="2" data-col="1" onclick="onCellClick(7, 2, 1)">-</button>
          <button class="cell disabled" data-index="8" data-row="2" data-col="2" onclick="onCellClick(8, 2, 2)">-</button>
        </div>

        <button class="btn-small" onclick="resetBoard()">Reset Local Board View</button>
      </section>

      <section class="card log-card">
        <div class="log-header">
          <h2>Security & Activity Log</h2>
          <button class="btn-small" onclick="clearLogs()">Clear Log</button>
        </div>
        <div class="log-container" id="logContainer">
          <div class="log-entry">
            <span class="log-time">[ready]</span>
            <span class="log-type-info">Client initialized. Register/login with JWT to connect to game rooms.</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    let stompClient = null;
    let isConnected = false;
    let jwtToken = null;
    let activeUsername = null;
    let activeGameId = null;
    let subscription = null;

    const statusBadge = document.getElementById('connectionStatus');
    const statusText = document.getElementById('statusText');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const authStatusText = document.getElementById('authStatusText');
    const gameIdInput = document.getElementById('gameIdInput');
    const joinBtn = document.getElementById('joinBtn');
    const logContainer = document.getElementById('logContainer');
    const roomLabel = document.getElementById('roomLabel');
    const lastMoveLabel = document.getElementById('lastMoveLabel');
    const cells = document.querySelectorAll('.cell');

    function addLog(message, type = 'info') {
      const now = new Date();
      const timeStr = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="log-type-${type}">${message}</span>`;
      logContainer.appendChild(entry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function clearLogs() {
      logContainer.innerHTML = '';
      addLog('Log cleared.', 'info');
    }

    function setConnectionState(state, text) {
      statusBadge.className = 'status-badge ' + state;
      statusText.textContent = text;
    }

    // Authenticate (Register or Login)
    async function handleAuth(action) {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        alert('Please provide username and password.');
        return;
      }

      addLog(`Sending ${action.toUpperCase()} request for "${username}"...`, 'info');

      try {
        const resp = await fetch(`/api/auth/${action}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        jwtToken = data.token;
        activeUsername = data.username;
        authStatusText.textContent = `Authenticated as: ${activeUsername} (Token: ${jwtToken.substring(0, 16)}...)`;
        authStatusText.style.color = '#4ade80';
        joinBtn.disabled = false;
        addLog(`Authenticated successfully! JWT token acquired.`, 'success');
      } catch (err) {
        addLog(`Authentication error: ${err.message}`, 'error');
        alert(err.message);
      }
    }

    async function toggleConnection() {
      if (isConnected) {
        disconnectClient();
      } else {
        await connectClient();
      }
    }

    // Join room via REST then connect via WebSocket with JWT in STOMP headers
    async function connectClient() {
      if (!jwtToken) {
        alert('Please login first to get a JWT token!');
        return;
      }

      const gameId = gameIdInput.value.trim();
      if (!gameId) {
        alert('Please specify a Game Room ID.');
        return;
      }
      activeGameId = gameId;

      // 1. Register as a participant in Supabase GameSession via REST API
      addLog(`Registering user "${activeUsername}" as participant in game "${activeGameId}"...`, 'info');
      try {
        const joinResp = await fetch(`/api/game/${activeGameId}/join`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${jwtToken}`
          },
          body: JSON.stringify({ username: activeUsername })
        });
        if (!joinResp.ok) {
          const errData = await joinResp.json();
          throw new Error(errData.error || 'Failed to join game room');
        }
        addLog(`Successfully registered as participant for game "${activeGameId}" in Supabase.`, 'success');
      } catch (err) {
        addLog(`Failed to register in room: ${err.message}`, 'error');
        return;
      }

      // 2. Connect via STOMP WebSocket sending JWT in CONNECT frame
      const isSecure = window.location.protocol === 'https:';
      const wsProtocol = isSecure ? 'wss:' : 'ws:';
      const host = window.location.host || 'localhost:8080';
      const brokerURL = `${wsProtocol}//${host}/ws-game`;

      setConnectionState('connecting', 'Connecting...');
      addLog(`Initiating STOMP WebSocket connection with Bearer JWT...`, 'info');
      joinBtn.disabled = true;

      stompClient = new StompJs.Client({
        brokerURL: brokerURL,
        connectHeaders: {
          Authorization: `Bearer ${jwtToken}`
        },
        reconnectDelay: 5000,
        heartbeatIncoming: 10000,
        heartbeatOutgoing: 10000,

        onConnect: (frame) => {
          isConnected = true;
          setConnectionState('connected', 'Connected');
          addLog(`STOMP session connected & authenticated by interceptor!`, 'success');

          joinBtn.textContent = 'Leave Room';
          joinBtn.className = 'btn btn-danger';
          joinBtn.disabled = false;
          gameIdInput.disabled = true;
          roomLabel.textContent = `Room: ${activeGameId}`;

          enableBoard(true);

          // Subscribe to verified topic
          const topic = `/topic/game/${activeGameId}`;
          addLog(`Subscribing to: ${topic}...`, 'info');

          subscription = stompClient.subscribe(topic, (message) => {
            handleIncomingMessage(message);
          });
        },

        onStompError: (frame) => {
          addLog(`STOMP Error (Access Denied / Security): ${frame.headers['message']}`, 'error');
          console.error('STOMP error:', frame);
        },

        onWebSocketClose: (event) => {
          addLog(`WebSocket connection closed (code: ${event.code})`, 'warning');
          handleDisconnectCleanup();
        },

        onWebSocketError: (error) => {
          addLog(`WebSocket error encountered.`, 'error');
        }
      });

      stompClient.activate();
    }

    function disconnectClient() {
      if (stompClient) {
        addLog('Disconnecting from server...', 'info');
        if (subscription) {
          subscription.unsubscribe();
          subscription = null;
        }
        stompClient.deactivate();
      }
      handleDisconnectCleanup();
    }

    function handleDisconnectCleanup() {
      isConnected = false;
      setConnectionState('', 'Disconnected');
      joinBtn.textContent = 'Join & Connect';
      joinBtn.className = 'btn btn-success';
      joinBtn.disabled = !jwtToken;
      gameIdInput.disabled = false;
      roomLabel.textContent = 'Room: None';
      enableBoard(false);
    }

    function enableBoard(enabled) {
      cells.forEach(cell => cell.classList.toggle('disabled', !enabled));
    }

    function onCellClick(index, row, col) {
      if (!isConnected || !stompClient) {
        alert('Please join room and connect before making moves!');
        return;
      }

      const payload = {
        playerId: activeUsername,
        moveData: { index, row, col }
      };

      const destination = `/app/game/${activeGameId}/move`;
      addLog(`Sending verified move to ${destination}: index=${index}`, 'info');

      stompClient.publish({
        destination: destination,
        body: JSON.stringify(payload)
      });
    }

    function handleIncomingMessage(message) {
      try {
        const gameState = JSON.parse(message.body);
        addLog(`[Broadcast] lastMoveBy="${gameState.lastMoveBy}" status="${gameState.status}"`, 'move');
        updateBoard(gameState);
      } catch (err) {
        addLog(`Error parsing GameState: ${err.message}`, 'error');
      }
    }

    function updateBoard(gameState) {
      lastMoveLabel.textContent = `Last Move: ${gameState.lastMoveBy || '-'}`;
      if (gameState.moveData && typeof gameState.moveData.index !== 'undefined') {
        const moveIdx = gameState.moveData.index;
        const targetCell = document.querySelector(`.cell[data-index="${moveIdx}"]`);
        if (targetCell) {
          cells.forEach(c => c.classList.remove('last-move'));
          targetCell.classList.add('last-move');
          targetCell.textContent = gameState.lastMoveBy.substring(0, 3).toUpperCase();
        }
      }
    }

    function resetBoard() {
      cells.forEach(c => {
        c.textContent = '-';
        c.classList.remove('last-move');
      });
      lastMoveLabel.textContent = 'Last Move: -';
      addLog('Reset local board representation.', 'info');
    }
  </script>
</body>
</html>
