server:
  port: 0

spring:
  jmx:
    enabled: false
  threads:
    virtual:
      enabled: true

  # In-memory H2 database for builds and unit tests (no Supabase connection required)
  datasource:
    url: jdbc:h2:mem:testgamedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
